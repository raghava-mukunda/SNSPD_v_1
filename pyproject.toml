# FILE: pyproject.toml
# PURPOSE:
# Defines the SNSPD Physics-Based Digital Twin package,
# dependencies, and development environment.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snspd"
version = "0.1.0"
description = "Physics-based digital twin framework for superconducting nanowire single-photon detectors"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "matplotlib>=3.8",
    "shapely>=2.0",
    "svgpathtools>=1.6",
    "pint>=0.23",
    "gdstk>=0.9",
    "gmsh>=4.12"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]